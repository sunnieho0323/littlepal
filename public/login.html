<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Little Pal — Login</title>
  <link rel="stylesheet" href="/css/login.css">
  <script>
    (function () {
      // If already logged in, go to homepage
      try {
        if (localStorage.getItem('lp_user')) {
          location.href = '/index.html';
        }
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <section class="card" role="form" aria-labelledby="title">
      <div class="brand">
        <h1 id="title">Sign in</h1>
        <p class="subtitle">Login to play with your pet</p>
      </div>

      <div id="error" class="alert" aria-live="polite" hidden></div>

      <form id="loginForm" novalidate>
        <label class="field">
          <span>Email</span>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        </label>

        <label class="field">
          <span>Password</span>
          <div class="password">
            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" minlength="8" required>
            <button type="button" id="togglePw" aria-label="Show password">👁</button>
          </div>
        </label>

        <button class="primary" type="submit">Sign in</button>
      </form>

      <p class="meta">
        Don’t have an account?
        <a class="link" href="/signup.html">Sign up</a>
      </p>
    </section>
  </main>

  <script src="/js/login.js"></script>
</body>
</html>
